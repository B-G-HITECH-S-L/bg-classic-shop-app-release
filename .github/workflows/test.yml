name: Release tooling tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Validate publishing scripts without contacting GitHub
        run: |
          /bin/bash -n scripts/release.sh
          python3 -B -m unittest discover -s tests -v
